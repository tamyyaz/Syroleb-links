# Deploys the site to Firebase Hosting (site "syroleb-links" ->
# https://syroleb-links.web.app) with the Next.js server running as a Cloud
# Function (Firebase "web frameworks" integration; needs the Blaze plan).
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT   full JSON of the service-account key
#   DATABASE_URL, DIRECT_URL   Supabase connection strings
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   ADMIN_SESSION_SECRET       long random string (openssl rand -hex 32)
#   SYSTEM_SESSION_SECRET      long random string for /system and /accounting sessions
#   SYSTEM_OWNER_EMAIL, SYSTEM_OWNER_PASSWORD   first owner login for /system (bootstrap)
#   CRON_SECRET
#   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS,
#   ORDER_NOTIFY_EMAIL, ORDER_FROM_EMAIL
# Optional variables: NEXT_PUBLIC_WHATSAPP_NUMBER, SUPABASE_STORAGE_BUCKET
name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Next.js server function reads this file at runtime; the public
      # values are also needed at build time.
      - name: Write production env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          SYSTEM_SESSION_SECRET: ${{ secrets.SYSTEM_SESSION_SECRET }}
          SYSTEM_OWNER_EMAIL: ${{ secrets.SYSTEM_OWNER_EMAIL }}
          SYSTEM_OWNER_PASSWORD: ${{ secrets.SYSTEM_OWNER_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ORDER_NOTIFY_EMAIL: ${{ secrets.ORDER_NOTIFY_EMAIL }}
          ORDER_FROM_EMAIL: ${{ secrets.ORDER_FROM_EMAIL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
        run: |
          {
            echo "NEXT_PUBLIC_SITE_NAME=Syroleb"
            echo "NEXT_PUBLIC_SITE_URL=https://syroleb-links.web.app"
            for v in DATABASE_URL DIRECT_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_STORAGE_BUCKET \
                     ADMIN_SESSION_SECRET SYSTEM_SESSION_SECRET SYSTEM_OWNER_EMAIL SYSTEM_OWNER_PASSWORD CRON_SECRET SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS \
                     ORDER_NOTIFY_EMAIL ORDER_FROM_EMAIL NEXT_PUBLIC_WHATSAPP_NUMBER; do
              val="${!v}"
              if [ -n "$val" ]; then printf '%s="%s"\n' "$v" "$val"; fi
            done
          } > .env.production

      # Creates/updates the tables. Fails (instead of dropping data) if a
      # schema change would be destructive.
      - name: Sync database schema
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy --only hosting:syroleb-links --project tamyyaz-3a83b --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
