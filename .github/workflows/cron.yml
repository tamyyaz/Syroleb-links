# Scheduled jobs (replaces the old Vercel Cron). Each job calls a protected
# API route; set these in the repo's Settings > Secrets and variables > Actions:
#   secret   CRON_SECRET  — same value as the CRON_SECRET env var of the site
#   variable SITE_URL     — e.g. https://syroleb-links.web.app
name: Scheduled jobs

on:
  schedule:
    - cron: "0 6 * * *"   # daily alerts: overdue invoices, low stock, expiring quotes
    - cron: "0 7 * * 0"   # weekly tasks: report + database backup email (Sundays)
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL variable is not set"; exit 1; fi
          if [ "$SCHEDULE" = "0 7 * * 0" ]; then path="weekly-tasks"; else path="daily-alerts"; fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/system/cron/$path"
